<!DOCTYPE html>
<html lang="es" data-tema="noche">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shukito Studio – El zorro y las gallinas</title>
  <meta name="description" content="El zorro y las gallinas es un juego de estrategia por turnos para jugar en familia. Próximamente en Google Play.">
  <meta name="theme-color" content="#14193a">

  <!-- Redes sociales. Imagen para compartir: dirección completa. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shukito Studio">
  <meta property="og:title" content="Shukito Studio – El zorro y las gallinas">
  <meta property="og:description" content="Un juego de estrategia para jugar en familia. Próximamente en Google Play.">
  <meta property="og:image" content="https://shukitostudio.github.io/assets/og.jpg">
  <meta property="og:locale" content="es_ES">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shukito Studio – El zorro y las gallinas">
  <meta name="twitter:description" content="Un juego de estrategia para jugar en familia. Próximamente en Google Play.">
  <meta name="twitter:image" content="https://shukitostudio.github.io/assets/og.jpg">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238a4a22'/%3E%3Cpath d='M12 14l14 10h12l14-10-3 24-17 14-17-14z' fill='%23f2792b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="social.css">
</head>
<body>

  <!-- Fondo ilustrado (noche y día) -->
  <div class="fondo" aria-hidden="true">
    <div class="fondo-lados noche"></div>
    <div class="fondo-lados dia"></div>
    <div class="fondo-columna noche"></div>
    <div class="fondo-columna dia"></div>
  </div>

  <main>
    <!-- 1. Portada -->
    <header class="portada">
      <div class="portada-grid">
        <img class="animal gallina" src="assets/gallina.webp" data-alt="gallinaAlt" alt="" width="700" height="573">
        <div class="portada-centro">
          <div class="cartel-logo">
            <img id="logo-img" data-alt="logoAlt" alt="">
            <h1 class="logo-texto">Shukito Studio</h1>
          </div>
          <p class="frase" data-i="portadaFrase"></p>
          <span class="btn-madera btn-play" role="button" aria-disabled="true" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
            <span data-i="botonPlay"></span>
          </span>
          <button type="button" id="btn-social" class="btn-madera btn-chico btn-social" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="currentColor"/></svg>
            <span data-i="socialBoton"></span>
          </button>
        </div>
        <img class="animal zorro" src="assets/zorro.webp" data-alt="zorroAlt" alt="" width="800" height="528">
      </div>
    </header>

    <!-- 2. Qué es el juego -->
    <section class="seccion">
      <div class="panel panel-ancho">
        <h2 data-i="queEsTitulo"></h2>
        <p class="texto-largo" data-i="queEsTexto"></p>
      </div>
    </section>

    <!-- 3. Cómo se juega -->
    <section class="seccion">
      <h2 class="titulo-suelto"><span data-i="comoTitulo"></span></h2>
      <div class="tarjetas cuatro">
        <article class="tarjeta">
          <div class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="14" width="28" height="22" rx="5"/><path d="M24 14V8"/><circle cx="24" cy="7" r="2"/><circle cx="18" cy="24" r="2.6" class="rel"/><circle cx="30" cy="24" r="2.6" class="rel"/><path d="M18 31h12"/><path d="M6 24v4M42 24v4"/></svg></div>
          <h3 data-i="como1Titulo"></h3>
          <p data-i="como1Texto"></p>
        </article>
        <article class="tarjeta">
          <div class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="36" rx="4"/><path d="M21 37h6"/><path d="M5 20c2-3 2-6 0-9M43 20c-2-3-2-6 0-9"/><path d="M8 28l5-4M40 28l-5-4"/></svg></div>
          <h3 data-i="como2Titulo"></h3>
          <p data-i="como2Texto"></p>
        </article>
        <article class="tarjeta">
          <div class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 19c10-9 26-9 36 0"/><path d="M12 26c7-6 17-6 24 0"/><path d="M18 33c4-3 8-3 12 0"/><circle cx="24" cy="39" r="2.4" class="rel"/></svg></div>
          <h3 data-i="como3Titulo"></h3>
          <p data-i="como3Texto"></p>
        </article>
        <article class="tarjeta">
          <div class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="16"/><path d="M8 24h32"/><path d="M24 8c-7 8-7 24 0 32M24 8c7 8 7 24 0 32"/></svg></div>
          <span class="etiqueta" data-i="como4Etiqueta"></span>
          <h3 data-i="como4Titulo"></h3>
          <p data-i="como4Texto"></p>
        </article>
      </div>
    </section>

    <!-- 4. Capturas -->
    <section class="seccion">
      <h2 class="titulo-suelto"><span data-i="capturasTitulo"></span></h2>
      <div class="capturas">
        <figure class="telefono"><img data-captura="1" data-alt="captura1Alt" src="assets/captura1-es.webp" alt="" width="540" height="1200" loading="lazy"></figure>
        <figure class="telefono"><img data-captura="2" data-alt="captura2Alt" src="assets/captura2-es.webp" alt="" width="540" height="1200" loading="lazy"></figure>
        <figure class="telefono"><img data-captura="3" data-alt="captura3Alt" src="assets/captura3-es.webp" alt="" width="540" height="1200" loading="lazy"></figure>
        <figure class="telefono"><img data-captura="4" data-alt="captura4Alt" src="assets/captura4-es.webp" alt="" width="540" height="1200" loading="lazy"></figure>
        <figure class="telefono"><img data-captura="5" data-alt="captura5Alt" src="assets/captura5-es.webp" alt="" width="540" height="1200" loading="lazy"></figure>
      </div>
    </section>

    <!-- 5. Por qué es distinto -->
    <section class="seccion">
      <h2 class="titulo-suelto"><span data-i="distintoTitulo"></span></h2>
      <div class="tarjetas tres">
        <article class="tarjeta">
          <div class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="12" width="34" height="24" rx="4"/><path d="M13 30l22-12"/><path d="M13 18h6M29 30h6"/></svg></div>
          <h3 data-i="distinto1Titulo"></h3>
          <p data-i="distinto1Texto"></p>
        </article>
        <article class="tarjeta">
          <div class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="16" cy="14" r="5"/><circle cx="33" cy="16" r="4"/><circle cx="24" cy="29" r="3.6"/><path d="M7 38v-5a9 9 0 0 1 18 0v5"/><path d="M27 38v-3a7 7 0 0 1 14 0v3"/></svg></div>
          <h3 data-i="distinto2Titulo"></h3>
          <p data-i="distinto2Texto"></p>
        </article>
        <article class="tarjeta">
          <div class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="17"/><path d="M15 19l4-2v14"/><path d="M26 19.5a3.5 3.5 0 0 1 7 0v9a3.5 3.5 0 0 1-7 0z"/><path d="M33 30l4 4" opacity="0"/></svg></div>
          <h3 data-i="distinto3Titulo"></h3>
          <p data-i="distinto3Texto"></p>
        </article>
      </div>
    </section>

    <!-- 6. Sobre Shukito Studio -->
    <section class="seccion">
      <div class="panel panel-ancho">
        <h2 data-i="sobreTitulo"></h2>
        <p class="texto-largo" data-i="sobreTexto"></p>
      </div>
    </section>
  </main>

  <!-- 7. Pie -->
  <footer class="pie">
    <div class="panel panel-pie">
      <div class="pie-fila">
        <span class="pie-etiqueta" data-i="pieCorreo"></span>
        <a class="enlace" href="mailto:shukitostudio@gmail.com">shukitostudio@gmail.com</a>
      </div>
      <div class="pie-fila">
        <a class="enlace" href="https://shukitostudio.github.io/zorro-privacidad/" target="_blank" rel="noopener" data-i="piePrivacidad"></a>
        <a class="enlace" href="#privacidad-social" data-abrir-privacidad data-i="piePrivacidadSocial"></a>
      </div>
      <div class="pie-controles">
        <button type="button" id="btn-tema" class="btn-madera btn-chico" aria-pressed="false">
          <svg class="ico-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="ico-luna" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor"/></svg>
          <span data-tema-etiqueta></span>
        </button>
        <div class="selector-idioma" role="group" data-i-label="pieIdioma" aria-label="Idioma / Language">
          <button type="button" class="btn-madera btn-chico" data-lang="es" aria-pressed="true">Español</button>
          <button type="button" class="btn-madera btn-chico" data-lang="en" aria-pressed="false">English</button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Chat Social (solo para invitados). Se apaga en social.js -->
  <div id="social" class="social" role="dialog" aria-modal="true" aria-labelledby="social-titulo" hidden>
    <div class="social-caja">
      <!-- Franja de arriba: el mono de Shukito -->
      <div class="social-cabecera">
        <img class="social-logo" src="assets/logo.webp" alt="" width="40" height="40">
        <div class="social-cabecera-texto">
          <h2 id="social-titulo" data-i="socialTitulo"></h2>
          <span id="social-estado" class="social-estado"></span>
        </div>
        <button type="button" id="social-cerrar" class="social-icono" data-i-label="socialCerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- Barra de perfil: mi foto, mi nombre y mi estado -->
      <div id="social-perfil" class="social-perfil" hidden>
        <button type="button" id="social-mi-avatar" class="social-avatar-boton" data-i-label="socialCambiarAvatar">
          <span id="social-mi-avatar-img" class="social-avatar grande" aria-hidden="true"></span>
        </button>
        <div class="social-perfil-texto">
          <span class="social-nombre-fila">
            <strong id="social-mi-nombre" class="social-mi-nombre"></strong>
            <span id="social-insignia-admin" class="social-insignia" data-i="socialAdminInsignia" hidden></span>
          </span>
          <button type="button" id="social-mi-estado" class="social-mi-estado" data-i-label="socialCambiarEstado"></button>
          <form id="social-estado-form" class="social-estado-form" autocomplete="off" hidden>
            <input id="social-estado-caja" type="text" maxlength="60" enterkeyhint="done" data-i-ph="socialEstadoPista" data-i-label="socialCambiarEstado">
          </form>
        </div>
        <div class="social-menu-caja">
          <button type="button" id="social-menu-boton" class="social-icono" aria-haspopup="menu" aria-expanded="false" aria-controls="social-menu" data-i-label="socialMenu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="19" r="2.2" fill="currentColor"/></svg>
          </button>
          <div id="social-menu" class="social-menu" role="menu" hidden>
            <button type="button" role="menuitem" id="social-op-avatar" data-i="socialCambiarAvatar"></button>
            <button type="button" role="menuitem" id="social-op-estado" data-i="socialCambiarEstado"></button>
            <button type="button" role="menuitem" id="social-op-admin" data-i="socialAdminEntrarMenu"></button>
            <button type="button" role="menuitem" id="social-op-admin-salir" data-i="socialAdminSalir" hidden></button>
            <button type="button" role="menuitem" id="social-op-salir" data-i="socialSalir"></button>
            <button type="button" role="menuitem" id="social-op-borrar" class="peligro" data-i="socialBorrarCuenta"></button>
          </div>
        </div>
      </div>

      <!-- Entrada: crear usuario o entrar con nombre y PIN -->
      <form id="social-entrar" class="social-entrar" autocomplete="off" novalidate>
        <p class="social-intro" data-i="socialIntro"></p>
        <div class="social-pestanas" role="tablist">
          <button type="button" role="tab" id="social-modo-nuevo" aria-selected="true" data-i="socialModoNuevo"></button>
          <button type="button" role="tab" id="social-modo-entrar" aria-selected="false" data-i="socialModoEntrar"></button>
        </div>
        <label class="social-campo">
          <span data-i="socialNombre"></span>
          <input id="social-nombre" name="nombre" type="text" maxlength="16" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" data-i-ph="socialNombrePista" required>
        </label>
        <fieldset id="social-elegir" class="social-elegir">
          <legend data-i="socialAvatar"></legend>
          <div id="social-avatares" class="social-avatares"></div>
        </fieldset>
        <label class="social-campo">
          <span data-i="socialPin"></span>
          <input id="social-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" data-i-ph="socialPinPista" required>
          <small id="social-pin-nota" class="social-nota" data-i="socialPinNota"></small>
        </label>
        <label class="social-campo">
          <span data-i="socialClave"></span>
          <input id="social-clave" name="clave" type="password" maxlength="64" autocomplete="off" required>
        </label>
        <p id="social-error" class="social-error" role="alert"></p>
        <button type="submit" class="social-boton" id="social-boton-entrar"><span data-i="socialCrear"></span></button>
        <a class="enlace social-enlace-priv" href="#privacidad-social" data-abrir-privacidad data-i="piePrivacidadSocial"></a>
      </form>

      <!-- Cambiar foto o avatar -->
      <div id="social-ventana-avatar" class="social-ventana" role="dialog" aria-modal="true" aria-labelledby="social-ventana-avatar-titulo" hidden>
        <div class="social-ventana-caja">
          <h3 id="social-ventana-avatar-titulo" data-i="socialCambiarAvatar"></h3>
          <div id="social-avatares-cambiar" class="social-avatares"></div>
          <p id="social-ventana-error" class="social-error" role="alert"></p>
          <div class="social-ventana-botones">
            <button type="button" id="social-avatar-cancelar" class="social-boton secundario"><span data-i="socialCancelar"></span></button>
            <button type="button" id="social-avatar-guardar" class="social-boton"><span data-i="socialGuardar"></span></button>
          </div>
        </div>
      </div>

      <!-- Entrar como administrador -->
      <div id="social-ventana-admin" class="social-ventana" role="dialog" aria-modal="true" aria-labelledby="social-ventana-admin-titulo" hidden>
        <form id="social-form-admin" class="social-ventana-caja" autocomplete="off" novalidate>
          <h3 id="social-ventana-admin-titulo" data-i="socialAdminTitulo"></h3>
          <p class="social-nota" data-i="socialAdminExplica"></p>
          <label class="social-campo">
            <span data-i="socialAdminClave"></span>
            <input id="social-admin-clave" type="password" maxlength="128" autocomplete="off" required>
          </label>
          <p id="social-admin-error" class="social-error" role="alert"></p>
          <div class="social-ventana-botones">
            <button type="button" id="social-admin-cancelar" class="social-boton secundario"><span data-i="socialCancelar"></span></button>
            <button type="submit" id="social-admin-entrar" class="social-boton"><span data-i="socialEntrar"></span></button>
          </div>
        </form>
      </div>

      <!-- Chat -->
      <div id="social-chat" class="social-chat" hidden>
        <!-- Botones de chats y contactos, y el chat abierto -->
        <div class="social-barra-chats">
          <button type="button" id="social-boton-chats" class="social-pildora" aria-expanded="false" aria-controls="social-panel-chats">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span data-i="socialChats"></span>
            <span id="social-asterisco-chats" class="social-asterisco" aria-hidden="true" hidden>*</span>
          </button>
          <div class="social-sala-actual">
            <span id="social-sala-avatar" class="social-avatar chico" aria-hidden="true"></span>
            <span class="social-sala-textos">
              <strong id="social-sala-nombre"></strong>
              <span id="social-sala-detalle" class="social-sala-detalle"></span>
            </span>
          </div>
          <button type="button" id="social-boton-contactos" class="social-pildora" aria-expanded="false" aria-controls="social-panel-contactos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 19c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.4 3.4 0 010 6.4M18 13.8c2 .7 3.2 2.5 3.6 5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span data-i="socialContactos"></span>
          </button>
        </div>

        <div class="social-vista">
          <div id="social-mensajes" class="social-mensajes" aria-live="polite"></div>
          <div id="social-escribiendo" class="social-escribiendo" aria-live="polite"></div>
          <form id="social-form" class="social-form" autocomplete="off">
            <textarea id="social-texto" rows="1" maxlength="500" data-i-ph="socialEscribe" data-i-label="socialEscribe"></textarea>
            <button type="submit" id="social-enviar" class="social-enviar" data-i-label="socialEnviar" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l18-8L3 4v6l12 2-12 2z" fill="currentColor"/></svg>
            </button>
          </form>
          <span id="social-contador" class="social-contador" aria-hidden="true"></span>

          <!-- Lista de chats: el general y los privados -->
          <section id="social-panel-chats" class="social-panel" aria-labelledby="social-panel-chats-titulo" hidden>
            <h3 id="social-panel-chats-titulo" class="social-panel-titulo" data-i="socialChats"></h3>
            <ul id="social-lista-chats" class="social-lista"></ul>
          </section>

          <!-- Contactos: todos los que crearon usuario -->
          <section id="social-panel-contactos" class="social-panel" aria-labelledby="social-panel-contactos-titulo" hidden>
            <h3 id="social-panel-contactos-titulo" class="social-panel-titulo" data-i="socialContactos"></h3>
            <ul id="social-lista-contactos" class="social-lista"></ul>
          </section>

          <!-- Panel de administrador (solo con la clave de administrador) -->
          <section id="social-panel-admin" class="social-panel social-panel-admin" aria-labelledby="social-panel-admin-titulo" hidden>
            <div class="social-admin-cabecera">
              <h3 id="social-panel-admin-titulo" class="social-panel-titulo" data-i="socialAdminPanel"></h3>
              <button type="button" id="social-admin-cerrar" class="social-icono" data-i-label="socialCerrar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              </button>
            </div>
            <p id="social-admin-aviso" class="social-admin-aviso" role="status"></p>

            <h4 class="social-admin-subtitulo" data-i="socialAdminClaveGrupo"></h4>
            <form id="social-admin-form-clave" class="social-admin-bloque" autocomplete="off" novalidate>
              <p id="social-admin-clave-estado" class="social-nota"></p>
              <label class="social-campo">
                <span data-i="socialAdminClaveNueva"></span>
                <input id="social-admin-clave-nueva" type="text" minlength="6" maxlength="64" autocapitalize="off" autocorrect="off" spellcheck="false" required>
              </label>
              <p class="social-nota" data-i="socialAdminClaveNota"></p>
              <button type="submit" class="social-boton"><span data-i="socialAdminClaveGuardar"></span></button>
            </form>

            <h4 class="social-admin-subtitulo" data-i="socialAdminUsuarios"></h4>
            <ul id="social-admin-usuarios" class="social-lista"></ul>

            <h4 class="social-admin-subtitulo" data-i="socialAdminChats"></h4>
            <p class="social-nota social-admin-bloque" data-i="socialAdminChatsNota"></p>
            <ul id="social-admin-chats" class="social-lista"></ul>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Privacidad del chat Social -->
  <div id="privacidad-social" class="social-priv" role="dialog" aria-modal="true" aria-labelledby="priv-titulo" hidden>
    <div class="panel social-priv-panel">
      <h2 id="priv-titulo" data-i="privTitulo"></h2>
      <ul class="social-priv-lista">
        <li data-i="priv1"></li>
        <li data-i="priv2"></li>
        <li data-i="priv3"></li>
        <li data-i="priv4"></li>
        <li data-i="priv6"></li>
        <li data-i="priv5"></li>
      </ul>
      <button type="button" class="btn-madera btn-chico" id="priv-cerrar"><span data-i="privCerrar"></span></button>
    </div>
  </div>

  <script src="textos.js"></script>
  <script src="script.js"></script>
  <script src="social-avatares.js"></script>
  <script src="social.js"></script>
</body>
</html>
