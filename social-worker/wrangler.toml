# Servidor del chat Social de Shukito Studio.
# Es un Worker NUEVO y separado: no tiene nada que ver con el servidor del modo Online del juego.
name = "shukito-social"
main = "src/index.js"
compatibility_date = "2025-09-01"

# La clave NO va aquí. Se guarda como secreto de Cloudflare con:
#   npx wrangler secret put CLAVE
# (Después, la clave del grupo se puede cambiar desde el panel de administrador de la página.)
#
# La clave de administrador tampoco va aquí. Es un secreto aparte, larga (12 caracteres o más):
#   npx wrangler secret put ADMIN_CLAVE

[vars]
# Horas que duran los mensajes antes de borrarse solos.
HORAS_MENSAJES = "24"
# Cuántos mensajes se guardan como máximo (los más nuevos).
MAX_MENSAJES = "200"
# Días sin entrar tras los que se borra un nombre de usuario (y su sesión en el teléfono).
DIAS_SESION = "30"
# Páginas que pueden usar el chat (separadas por coma).
ORIGENES = "https://shukitostudio.github.io,http://localhost:8080,http://127.0.0.1:8080"

# Fotos, videos y audios del chat (Cloudflare R2). Antes de publicar, una sola vez:
#   1) Activar R2 en el panel de Cloudflare (pide una tarjeta, aunque los primeros 10 GB son gratis).
#   2) npx wrangler r2 bucket create shukito-social-archivos
#   3) Regla de respaldo para que R2 borre solo lo que quede después de 2 días:
#      npx wrangler r2 bucket lifecycle add shukito-social-archivos borrar-2-dias m/ --expire-days 2
# El servidor ya borra cada archivo junto con su mensaje (a las 24 horas); la regla es por si acaso.
[[r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "shukito-social-archivos"

# Botón Traducir (español <-> inglés) con Workers AI de Cloudflare.
# Tiene un uso gratis por día; con mucho uso se paga. Cada persona puede pedir 40 traducciones nuevas cada 10 minutos
# y cada traducción se guarda para no pedirla dos veces.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "SALA"
class_name = "SalaSocial"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalaSocial"]
